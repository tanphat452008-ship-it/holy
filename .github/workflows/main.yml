name: Build APK Windows (Stable Fix)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      # =========================
      # 1. Checkout code
      # =========================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================
      # 2. Setup Java 17
      # =========================
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # =========================
      # 3. Gradle cache + stable setup
      # (FIX lỗi download gradle)
      # =========================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # =========================
      # 4. Android SDK
      # =========================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-33 build-tools;33.0.2"
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true

      # =========================
      # 5. Enable long paths (Windows fix)
      # =========================
      - name: Enable long paths
        shell: powershell
        run: |
          git config --system core.longpaths true
          reg add "HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\FileSystem" /v LongPathsEnabled /t REG_DWORD /d 1 /f

      # =========================
      # 6. Build APK (FIX chính)
      # =========================
      - name: Build APK
        shell: cmd
        run: gradlew.bat clean assembleDebug --no-daemon --stacktrace

      # =========================
      # 7. Rename APK
      # =========================
      - name: Rename APK
        shell: pwsh
        run: |
          Move-Item app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/app.apk

      # =========================
      # 8. Upload Release
      # =========================
      - name: Upload Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: build-${{ github.run_number }}
          name: Release Build ${{ github.run_number }}
          files: app/build/outputs/apk/debug/app.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
