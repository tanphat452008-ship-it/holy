name: Build APK Windows (Release Version)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-cache-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-cache-${{ runner.os }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-36
            build-tools;36.0.0
            cmake;3.22.1
            ndk;28.0.13004108

      - name: Enable Long Paths
        shell: powershell
        run: |
          git config --system core.longpaths true

      - name: Build Release APK
        shell: cmd
        run: |
          call gradlew.bat clean assembleRelease --stacktrace

      - name: List APK files
        shell: cmd
        run: |
          echo ===== APK FILES =====
          dir app\build\outputs\apk /s

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HOLY-APK
          path: app/build/outputs/apk/**/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Release Build v${{ github.run_number }}
          body: |
            Build từ nhánh ${{ github.ref_name }}
            Commit: ${{ github.sha }}
          files: app/build/outputs/apk/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
