name: Build APK Windows (Release Version)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Cache Gradle (🔥 FIX LỚN)
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-cache-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      # 3. JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 4. Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-33 build-tools;33.0.2"
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true

      # 5. Fix Gradlew permission (🔥 QUAN TRỌNG)
      - name: Grant execute permission
        shell: pwsh
        run: |
          if (Test-Path "./gradlew") {
            git update-index --chmod=+x gradlew
          }

      # 6. Enable long paths
      - name: Enable long paths
        shell: powershell
        run: |
          git config --system core.longpaths true
          reg add "HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\FileSystem" /v LongPathsEnabled /t REG_DWORD /d 1 /f

      # 7. Build APK (🔥 FIX RETRY)
      - name: Build Debug APK
        shell: cmd
        run: |
          call gradlew.bat clean assembleDebug --stacktrace || call gradlew.bat assembleDebug --stacktrace
          
      # 9. Upload Release
      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          files: app/build/outputs/apk/debug/basibacity.apk
          tag_name: build-${{ github.run_number }}
          name: Release Build v${{ github.run_number }}
          body: |
            Build từ nhánh ${{ github.ref_name }}
            Commit: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
