name: Build APK (Final Stable No-Proxy Fix)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      # =========================
      # 1. Checkout source
      # =========================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================
      # 2. Clean ALL proxy / env injection (FIX 127.0.0.1:12334)
      # =========================
      - name: Remove proxy + env injection (CRITICAL FIX)
        shell: bash
        run: |
          unset HTTP_PROXY
          unset HTTPS_PROXY
          unset http_proxy
          unset https_proxy
          unset JAVA_TOOL_OPTIONS
          unset GRADLE_OPTS

      # =========================
      # 3. Force Gradle properties NO PROXY
      # =========================
      - name: Force Gradle no proxy
        shell: bash
        run: |
          mkdir -p ~/.gradle
          cat <<EOF > ~/.gradle/gradle.properties
systemProp.http.proxyHost=
systemProp.http.proxyPort=
systemProp.https.proxyHost=
systemProp.https.proxyPort=
EOF

      # =========================
      # 4. Setup JDK 17 (clean)
      # =========================
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # =========================
      # 5. Android SDK
      # =========================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-33 build-tools;33.0.2"
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true

      # =========================
      # 6. ONLY ONE Gradle system (NO wrapper download)
      # =========================
      - name: Setup Gradle (safe mode)
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.6

      # =========================
      # 7. Build APK (CLEAN PIPELINE)
      # =========================
      - name: Build APK
        uses: gradle/gradle-build-action@v3
        with:
          arguments: clean assembleDebug --no-daemon

      # =========================
      # 8. Rename APK
      # =========================
      - name: Rename APK
        shell: pwsh
        run: |
          Move-Item app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/app.apk

      # =========================
      # 9. Upload Release
      # =========================
      - name: Upload Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: app/build/outputs/apk/debug/app.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
