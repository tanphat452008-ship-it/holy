plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
}

android {
    namespace 'com.holy.game'

    compileSdk 36
    ndkVersion '28.0.13004108'

    flavorDimensions "version"

    productFlavors {
        ver_release {
            dimension "version"

            manifestPlaceholders = [
                    appName: "HOLY SA"
            ]

            firebaseCrashlytics {
                nativeSymbolUploadEnabled true
            }

            externalNativeBuild {
                cmake {
                    cppFlags "-fvisibility=hidden"
                }
            }
        }

        ver_test {
            dimension "version"

            versionNameSuffix "-test"

            manifestPlaceholders = [
                    appName: "HOLY TEST"
            ]

            firebaseCrashlytics {
                nativeSymbolUploadEnabled false
            }
        }
    }

    defaultConfig {
        applicationId "com.holy.game"
        minSdk 26
        targetSdk 36
        versionCode 5
        versionName "5.5"

        multiDexEnabled true

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = "21"
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
            jniDebuggable false
            renderscriptDebuggable false

            externalNativeBuild {
                cmake {
                    cppFlags "-g"
                }
            }
        }

        release {
            signingConfig signingConfigs.debug
        }
    }

    buildFeatures {
        buildConfig true
        viewBinding true
        prefab true
    }

    androidResources {
        noCompress "mp3"
    }

    packaging {
        jniLibs {
            excludes += ["META-INF/*"]
        }
        resources {
            excludes += ["META-INF/*"]
        }
    }

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])

    implementation 'com.bytedance.android:shadowhook:1.0.10'
    implementation 'com.airbnb.android:lottie:6.4.0'
    implementation 'com.github.rommansabbir:AnimationX:2.0'
    implementation 'nl.dionsegijn:konfetti-xml:2.0.2'

    implementation 'com.google.android.material:material:1.13.0'
    implementation 'org.ini4j:ini4j:0.5.4'
    implementation 'com.github.skydoves:progressview:1.1.3'
    implementation 'com.github.Triggertrap:SeekArc:v1.1'
    implementation 'com.akexorcist:round-corner-progress-bar:2.1.2'
    implementation 'com.makeramen:roundedimageview:2.3.0'

    implementation 'com.github.bumptech.glide:glide:4.15.1'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.15.1'

    implementation platform('com.google.firebase:firebase-bom:34.3.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-crashlytics'
    implementation 'com.google.firebase:firebase-crashlytics-ndk'
    implementation 'com.google.firebase:firebase-messaging'

    implementation 'com.google.android.gms:play-services-auth:20.7.0'

    implementation 'com.squareup.picasso:picasso:2.8'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'

    implementation 'com.github.valkriaine:Bouncy:2.3'

    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'

    implementation 'androidx.viewpager2:viewpager2:1.1.0'

    implementation 'org.apache.commons:commons-lang3:3.0'

    implementation 'com.github.skydoves:colorpickerview:2.2.4'
    implementation 'com.github.Mohammad3125:KavehColorPicker:v1.2.1'
    implementation 'com.mikhaellopez:circularprogressbar:3.1.0'

    implementation 'net.orandja.shadowlayout:shadowlayout:1.0.1'
}
